# Copy to config.toml and replace the absolute workspace path below.
# Interactive MCP confirmation must remain available; headless runs need
# explicit, invocation-scoped approvals for the exact tools they will use.
#
# remote-dev and vaws-coordinator are installed workspace packages
# (`uv sync`). The MCP servers run as `python -m ...` under `.venv`.
approval_policy = "on-request"

[mcp_servers.remote_dev]
command = "/absolute/path/to/vllm-ascend-workspace/.venv/bin/python"
args = ["-m", "remote_dev.mcp.server"]
cwd = "/absolute/path/to/vllm-ascend-workspace"
startup_timeout_sec = 20
tool_timeout_sec = 600
enabled = true

[mcp_servers.remote_dev.env]
REMOTE_DEV_DEFAULT_USER = "root"
REMOTE_DEV_DEFAULT_ROOT = "/vllm-workspace"
REMOTE_DEV_DEFAULT_CWD = "/vllm-workspace"
REMOTE_DEV_RUNTIME_ENV_FILE = "/etc/profile.d/vaws-ascend-env.sh"
REMOTE_DEV_RESOLVERS = "/absolute/path/to/vllm-ascend-workspace/.agents/lib/vaws_remote_dev_plugin.py:setup"
REMOTE_DEV_STATE_DIR = "/absolute/path/to/vllm-ascend-workspace/.vaws-local/remote-dev-state"
REMOTE_DEV_SSH_MUX_DIR = "~/.ssh/vaws-mux"

[mcp_servers.vaws_task]
command = "/absolute/path/to/vllm-ascend-workspace/.venv/bin/python"
args = ["-m", "vaws_coordinator", "task-server"]
cwd = "/absolute/path/to/vllm-ascend-workspace"
startup_timeout_sec = 20
tool_timeout_sec = 600
enabled = true

[mcp_servers.vaws_task.env]
VAWS_AGENT_SESSIONS_DIR = "/absolute/path/to/vllm-ascend-workspace/.vaws-local/agent-sessions"

[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^Bash$|^apply_patch$|^mcp__(remote-dev|remote_dev)__.*"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '/absolute/path/to/vllm-ascend-workspace/.venv/bin/python -m remote_dev.hooks.codex_remote_guard'
timeout = 30
statusMessage = "Checking remote development policy"

[[hooks.SessionEnd]]

[[hooks.SessionEnd.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.agents/hooks/knowledge_session_end.py"'
timeout = 3
