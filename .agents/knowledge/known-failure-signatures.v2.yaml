      "rule": {
        "avoidance": "Run a probe on/off comparison before trusting any dump: issue the same deterministic request with the probe disabled and enabled and confirm the symptom is identical. If it is not, fix the probe before reading its output. Do not place probes inside submodule forwards that clone, reduce or synchronize on device.",
        "fingerprints": [
          "symptom disappears when dump enabled",
          "dump synchronize completes non_blocking copy",
          "instrumented run correct uninstrumented run wrong"
        ],
        "resolution": "Compute statistics on device, accumulate them, and perform exactly one synchronize plus device-to-host transfer after the values already have a consumer, typically once logits exist. ascend-tensor-dump does this in finish() and nowhere else.",
        "root_cause": "Reading device values mid-forward forces a synchronization that closes the race window. Asynchronous copies issued with non_blocking=True may legitimately complete after the forward pass, and the probe silently changes their observed ordering.",
        "summary": "A dump that synchronizes or copies to host inside the forward pass can complete the async copy the bug depends on, so every dumped value looks correct",
        "symptom": "With instrumentation enabled the intermediate tensors are all consistent and the end-to-end symptom weakens or disappears; removing the instrumentation brings the symptom back. Investigation drifts toward blaming copy timing while the real defect stays hidden."
      },
