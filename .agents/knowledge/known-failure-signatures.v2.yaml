      "rule": {
        "avoidance": "When a captured input set is meant to be replayable, verify the captured shapes against the manifest's recorded shapes before replaying. A parameter whose captured shape equals the row limit is corrupt, not small.",
        "fingerprints": [
          "aclnnAddRmsNorm failed error code 561103 gamma shape",
          "shape of gamma should be equal to the last 1 dim of x1",
          "captured weight shape equals dump row limit"
        ],
        "resolution": "Apply the row limit only to tensors with 2 or more dimensions and keep 1-D tensors whole. Weights are small, so this costs nothing in dump size.",
        "root_cause": "Row limiting slices dim 0. For an activation that is the token axis and slicing is harmless; for a 1-D weight or per-channel parameter dim 0 is the only axis, so the limit truncates the parameter itself.",
        "summary": "A row limit meant to bound token count destroys 1-D weights in a captured operator input set, so the replay fails or compares the wrong thing",
        "symptom": "Standalone replay of a captured operator call fails with a shape complaint against a parameter rather than an activation, for example aclnnAddRmsNorm error 561103 reporting gamma [8] against x1 [1, 1024]. The manifest records the true shapes, so nothing looks wrong until the replay runs."
      },
