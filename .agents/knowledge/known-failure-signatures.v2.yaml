      "rule": {
        "avoidance": "A py_compile check proves only syntax. Before interpreting an empty capture, confirm the instrumented line is actually reachable in this build; an inline import of the probe inside a dead branch also hides missing module-level imports until runtime.",
        "fingerprints": [
          "operator input set missing from dump but manifest present",
          "enable_custom_op true instrumented fallback branch",
          "no tensor file written despite capture_inputs call"
        ],
        "resolution": "Place the input capture above the branch so it runs on either path. Confirm the live arm by evaluating enable_custom_op() in the container before assuming which kernel is under test.",
        "root_cause": "vllm-ascend operator wrappers commonly branch on enable_custom_op() between a torch.ops._C_ascend fused kernel and a torch_npu fallback. Which arm runs depends on the build, not on the model or the request.",
        "summary": "Instrumenting one arm of a custom-op branch captures nothing on a build that takes the other arm, and the empty result looks like a selector problem",
        "symptom": "The dump manifest is produced with the expected record count from other capture points, but the operator input set is absent and no tensor payload is written. Time is then spent debugging the arming selector rather than the capture point."
      },
