      "rule": {
        "avoidance": "Read the one-sided stage lists before the metrics. Non-empty lists usually mean the two runs did not execute the same instrumented code, and no numeric conclusion holds until the paths are aligned.",
        "fingerprints": [
          "dump diff aligned but only_in_left non-empty",
          "tensor comparison pass with zero compared items",
          "eager versus graph dump verdict aligned"
        ],
        "resolution": "Rank coverage asymmetry as its own verdict between clean and divergent, and make the gating flag fail on it. Reserve a clean verdict for runs whose stage-key sets actually match.",
        "root_cause": "Divergence is only defined over the intersection of stage keys, so shrinking the intersection makes the verdict look better. Coverage asymmetry is the stronger signal and it was being discarded.",
        "summary": "A verdict computed only over stages present on both sides reports agreement when one run captured almost nothing",
        "symptom": "Comparing an eager dump against a graph dump returns an aligned verdict and exit code 0 while listing over a hundred stages as present on only one side. A tensor comparison with zero comparable pairs likewise reports a pass."
      },
