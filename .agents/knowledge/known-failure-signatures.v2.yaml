      "rule": {
        "avoidance": "Before analyzing any dump, read label, match_index, occurrence and metadata from the manifest and confirm the selected unit is the intended request. Do not assume 'first match' means 'first request'.",
        "fingerprints": [
          "dump match index selects prefill chunk not request",
          "same request id multiple dump matches num_computed_tokens",
          "dumped tensors do not match failing request"
        ],
        "resolution": "Key the selector on the request id and count distinct labels, not calls. ascend-tensor-dump splits this into DUMP_PROBE_MATCH (which distinct label) and DUMP_PROBE_OCCURRENCE (which call within that label), and refuses to re-arm a label it already dumped.",
        "root_cause": "Chunked prefill calls the model forward once per chunk for a single request. Selecting the Nth forward call therefore selects the Nth chunk, not the Nth request. With a 7680-token chunk size, the first three 'matches' were all the first request.",
        "summary": "A dump selector that counts forward calls treats one chunked-prefill request as several requests and dumps the wrong unit of work",
        "symptom": "The dump manifest looks structurally valid but its metadata does not match the request under investigation: successive 'matches' all carry the same request id with increasing num_computed_tokens, and the dumped tensors do not correspond to the failing generation. An entire dump round is wasted."
      },
      "scope": {
