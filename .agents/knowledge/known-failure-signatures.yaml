    {
      "id": "gloo-init-container-hostname-missing-from-etc-hosts",
      "status": "active",
      "source": "promoted from local candidate vllm-ascend-serving-vllm-service-on-fresh-vaws-containers-fails-gloo-28e3bdbe5d (verified 2026-09-02)",
      "applicable_versions": "Verified 2026-09-02 on workspace A3 containers (vllm-ascend images), TP2/TP4/TP8/TP16 services on 192.168.13.153-156.",
      "updated_at": "2026-09-03",
      "first_seen": "2026-09-03",
      "scope": {
        "component": "service bootstrap",
        "environment": "vaws session containers",
        "subsystem": "gloo distributed init"
      },
      "rule": {
        "summary": "vLLM service on fresh VAWS containers fails gloo/HCCL init because /etc/hosts lacks the container hostname",
        "symptom": "vllm serve crashes or hangs during distributed init with gloo backend errors mentioning the container hostname (e.g. 'Name or service not known' / gloo::makeDeviceForHostname), even on single-node TP>1.",
        "root_cause": "Fresh session containers do not map their own hostname in /etc/hosts. PyTorch's gloo store/backend resolves the local hostname at init and fails when it does not resolve to an address.",
        "resolution": "Add '127.0.0.1 <hostname>' (hostname from `hostname`) to /etc/hosts inside the container before starting vllm serve. vllm-ascend-serving / session bootstrap should enforce this on every new container before first serve_start.",
        "avoidance": "Do not debug gloo/HCCL env vars (GLOO_SOCKET_IFNAME etc.) before checking /etc/hosts; the hostname mapping is the root cause in this container family.",
        "fingerprints": [
          "gloo makedeviceforhostname",
          "name or service not known hostname",
          "torch.distributed gloo init failed container"
        ],
        "candidate_id": "vllm-ascend-serving-vllm-service-on-fresh-vaws-containers-fails-gloo-28e3bdbe5d",
        "verification": [
          "Adding 127.0.0.1 <hostname> to /etc/hosts before serve_start made TP>1 services reach ready on all four verification machines (2026-09-02)."
        ]
      }
    },
    {
      "id": "ssh-stream-over-shared-controlmaster-mux-dies-early",
      "status": "active",
      "source": "promoted from local candidate remote-toolbox-ssh-stream-through-the-shared-controlmaster-mux--fbff8c67cb (PR #70)",
      "applicable_versions": "Verified 2026-09-02 on macOS client + VAWS containers, OpenSSH ControlMaster shared connections.",
      "updated_at": "2026-09-03",
      "first_seen": "2026-09-03",
      "scope": {
        "component": "ssh transport",
        "environment": "macOS client to VAWS containers",
        "subsystem": "ControlMaster mux"
      },
      "rule": {
        "summary": "ssh_stream through the shared ControlMaster mux fails on long-running remote commands; run stream/tunnel off the mux",
        "symptom": "Long-lived SSH streaming commands (service logs, analyse progress, tunnels) die or hang immediately / return early when issued over the shared ControlMaster connection; MCP remote_bash separately reported instant 'timeout' for any command while remote_probe/remote_ls kept working.",
        "root_cause": "The shared ControlMaster mux channel does not reliably carry long-lived stream sessions in this environment; stream-type invocations must bypass the mux (dedicated connection) instead of multiplexing over it.",
        "resolution": "Use base_ssh_options(mux=False) for ssh_stream and for any long-lived tunnel/stream command (fixed in remote-code-parity + vllm-ascend-serving ssh helpers, PR #70). Fall back to direct 'ssh -o BatchMode=yes -p <port> root@<host>' when MCP remote_bash misbehaves.",
        "avoidance": "Do not retry the same stream command on the mux hoping for a different result; check mux options first. Treat instant 'timeout' from MCP remote_bash as a tool-service fault signature, not a remote command fault.",
        "fingerprints": [
          "ssh_stream instant timeout controlmaster",
          "remote_bash instant timeout any command",
          "stream closed early mux"
        ],
        "candidate_id": "remote-toolbox-ssh-stream-through-the-shared-controlmaster-mux--fbff8c67cb",
        "verification": [
          "serve_start log streaming and long analyse runs completed after switching stream commands to base_ssh_options(mux=False) (2026-09-02, PR #70 head commits)."
        ]
      }
    },
    {
      "id": "dump-selector-counts-prefill-chunks-as-separate-requests",
      "status": "active",
      "source": "extracted from local Kimi-K3 forward-dump investigation records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on Kimi-K3 vLLM Ascend v0.26.0rc trees with chunked prefill enabled. The mechanism applies to any model whose prompt is split into prefill chunks.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "tensor dump instrumentation",
        "environment": "vllm-ascend serving with chunked prefill",
        "subsystem": "dump arming selector"
      },
      "rule": {
        "summary": "A dump selector that counts forward calls treats one chunked-prefill request as several requests and dumps the wrong unit of work",
        "symptom": "The dump manifest looks structurally valid but its metadata does not match the request under investigation: successive 'matches' all carry the same request id with increasing num_computed_tokens, and the dumped tensors do not correspond to the failing generation. An entire dump round is wasted.",
        "root_cause": "Chunked prefill calls the model forward once per chunk for a single request. Selecting the Nth forward call therefore selects the Nth chunk, not the Nth request. With a 7680-token chunk size, the first three 'matches' were all the first request.",
        "resolution": "Key the selector on the request id and count distinct labels, not calls. ascend-tensor-dump splits this into DUMP_PROBE_MATCH (which distinct label) and DUMP_PROBE_OCCURRENCE (which call within that label), and refuses to re-arm a label it already dumped.",
        "avoidance": "Before analyzing any dump, read label, match_index, occurrence and metadata from the manifest and confirm the selected unit is the intended request. Do not assume 'first match' means 'first request'.",
        "fingerprints": [
          "dump match index selects prefill chunk not request",
          "same request id multiple dump matches num_computed_tokens",
          "dumped tensors do not match failing request"
        ],
        "verification": [
          "Re-keying the selector on request id made the armed forward correspond to the intended request; the earlier three matches were confirmed to be three prefill chunks of one request (Kimi-K3 forward-dump investigation, 2026-08)."
        ]
      }
    },
    {
      "id": "dump-readback-synchronizes-async-copy-and-hides-the-bug",
      "status": "active",
      "source": "extracted from local Kimi-K3 forward-dump investigation records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on Kimi-K3 vLLM Ascend v0.26.0rc trees involving non_blocking device copies. Applies to any dump probe that synchronizes inside the forward pass.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "tensor dump instrumentation",
        "environment": "vllm-ascend serving on Ascend NPU",
        "subsystem": "device-to-host read-back placement"
      },
      "rule": {
        "summary": "A dump that synchronizes or copies to host inside the forward pass can complete the async copy the bug depends on, so every dumped value looks correct",
        "symptom": "With instrumentation enabled the intermediate tensors are all consistent and the end-to-end symptom weakens or disappears; removing the instrumentation brings the symptom back. Investigation drifts toward blaming copy timing while the real defect stays hidden.",
        "root_cause": "Reading device values mid-forward forces a synchronization that closes the race window. Asynchronous copies issued with non_blocking=True may legitimately complete after the forward pass, and the probe silently changes their observed ordering.",
        "resolution": "Compute statistics on device, accumulate them, and perform exactly one synchronize plus device-to-host transfer after the values already have a consumer, typically once logits exist. ascend-tensor-dump does this in finish() and nowhere else.",
        "avoidance": "Run a probe on/off comparison before trusting any dump: issue the same deterministic request with the probe disabled and enabled and confirm the symptom is identical. If it is not, fix the probe before reading its output. Do not place probes inside submodule forwards that clone, reduce or synchronize on device.",
        "fingerprints": [
          "symptom disappears when dump enabled",
          "dump synchronize completes non_blocking copy",
          "instrumented run correct uninstrumented run wrong"
        ],
        "verification": [
          "Moving the read-back to after logits and keeping the forward pass free of host reads reproduced the original symptom while still producing usable dumps (Kimi-K3 forward-dump investigation, 2026-08)."
        ]
      }
    },
    {
      "id": "graph-capture-device-to-host-probe-changes-measured-behavior",
      "status": "active",
      "source": "extracted from local Kimi-K3 and ACL Graph validation records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on Ascend ACL Graph capture/replay in vLLM Ascend v0.26.0rc trees, including FULL_DECODE_ONLY configurations.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "graph mode instrumentation",
        "environment": "vllm-ascend ACL Graph capture and replay",
        "subsystem": "graph-internal dump"
      },
      "rule": {
        "summary": "Adding a device-to-host copy or synchronization during graph capture changes the behavior being validated; graph dumps must copy device-to-device and read back after replay",
        "symptom": "Graph-mode validation either cannot reproduce the divergence it is meant to measure, or the instrumented graph behaves differently from the production graph. Python-level probes appear to record nothing during decode.",
        "root_cause": "Two distinct effects. A host read-back inside the capture window becomes part of the captured graph and alters its execution. Separately, replay does not re-enter Python, so Python-level probes and print statements never run during replay and cannot prove anything about graph-internal state.",
        "resolution": "Pre-allocate buffers at module construction time, copy into them with copy_ inside the graph so the copy node is captured, and synchronize plus read back outside the graph after replay. ascend-tensor-dump exposes this as graph_slot plus capture_graph, and finish() returns without reading when the stream is capturing.",
        "avoidance": "Do not gate a graph-internal copy on a runtime flag: the copy node is baked in at capture time. If the only way to obtain data is to force the dumped forward onto the eager path, state explicitly that the resulting conclusion does not cover the graph path. Health check 503 during a 15-20 minute capture is not a failure.",
        "fingerprints": [
          "d2h during graph capture changes behavior",
          "python probe not executed during graph replay",
          "aclgraph capture dump synchronize"
        ],
        "verification": [
          "Graph-internal copies into pre-allocated buffers with read-back after replay produced usable per-layer state while preserving the divergence, whereas an in-capture host read did not (Kimi-K3 KDA recurrent trace, 2026-08)."
        ]
      }
    },
    {
      "id": "contiguous-cpu-save-erases-storage-aliasing-evidence",
      "status": "active",
      "source": "extracted from local Kimi-K3 hybrid KV cache investigation records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on Kimi-K3 hybrid attention KV cache layouts (v0.26.0rc trees, A3 multi-node). Applies to any cache, block-table or state-reuse defect.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "tensor dump instrumentation",
        "environment": "vllm-ascend serving with hybrid or paged KV cache",
        "subsystem": "dump metadata"
      },
      "rule": {
        "summary": "Saving only contiguous host copies of tensors erases the stride and storage pointer evidence that cache-aliasing defects leave behind",
        "symptom": "Numerical comparison shows a layer producing wrong values but no comparison explains why, because every dumped tensor is a clean contiguous array. Investigation stalls on 'this layer is numerically off' without reaching a cause.",
        "root_cause": "The defect is structural rather than arithmetic: two consumers share one device allocation through different compact strides or offsets, so one writer corrupts another reader. contiguous() and .cpu() normalize exactly the layout information that identifies this.",
        "resolution": "Record logical shape and dtype alongside physical stride, storage_offset, storage pointer and NPU format for every captured tensor, and group stages by shared storage pointer before comparing values. ascend-tensor-dump writes these into every manifest record and reports storage_aliases with a stride_conflict flag.",
        "avoidance": "For any suspected cache, block-table or state-reuse defect, compare storage pointers, offsets and strides before comparing max_abs. A conclusion of the form 'layer N is numerically off' is not a root cause; 'writer, address, victim reader' is.",
        "fingerprints": [
          "different stride shared storage kv group",
          "contiguous cpu dump loses stride pointer",
          "cache collision invisible in tensor comparison"
        ],
        "verification": [
          "Comparing storage pointers and block ids across layers identified two logical cache entries sharing one physical backing, which value-level comparison of contiguous copies had not revealed (Kimi-K3 hybrid KV investigation, 2026-08)."
        ]
      }
    },
    {
      "id": "debug-instrumentation-written-to-host-path-invisible-in-container",
      "status": "active",
      "source": "extracted from local Kimi-K3 compressor probe records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on VAWS session containers where the host workspace and the container package tree differ.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "remote instrumentation delivery",
        "environment": "vaws session containers",
        "subsystem": "source tree resolution"
      },
      "rule": {
        "summary": "Instrumentation written to a host path that the container does not import runs never, while the sync step still reports success",
        "symptom": "Parity or file write reports success and the file exists, but the probe produces no output, no log line and no dump directory. Time is then spent debugging the probe logic itself.",
        "root_cause": "The service imports the package from a different tree than the one that was written. A host-side workspace path and the container-visible site-packages or editable install path are not the same location.",
        "resolution": "Resolve the tree the service actually imports before writing anything: read the package __file__ inside the container and write the probe next to it. Confirm the file is present at that resolved path.",
        "avoidance": "Treat 'no probe output at all' as a delivery problem first and a logic problem second. Do not add more instrumentation until the resolved import path has been confirmed.",
        "fingerprints": [
          "probe file written but never executed",
          "sync success but no dump output",
          "host workspace path vs container package path"
        ],
        "verification": [
          "Resolving the container-visible package directory and writing the probe there produced probe output on the next request, with no change to the probe code (Kimi-K3 compressor probe, 2026-08)."
        ]
      }
    },
    {
      "id": "nonfinite-values-in-pre-clear-scratch-buffers-are-not-root-cause",
      "status": "active",
      "source": "extracted from local Kimi-K3 state-dump investigation records (2026-08) while generalizing the dump framework into ascend-tensor-dump",
      "applicable_versions": "Observed 2026-08 on Kimi-K3 recurrent state and Mamba-style copy paths (v0.26.0rc trees). Applies to any uninitialized scratch or pre-copy buffer.",
      "updated_at": "2026-09-07",
      "first_seen": "2026-09-07",
      "scope": {
        "component": "dump interpretation",
        "environment": "vllm-ascend serving on Ascend NPU",
        "subsystem": "non-finite value attribution"
      },
      "rule": {
        "summary": "NaN or Inf found in a buffer sampled before it is cleared or overwritten is expected and must not be attributed as the defect",
        "symptom": "A dump scan flags a stage such as an initial state before clear or a destination before copy as the first non-finite stage, and the investigation concludes there is state corruption. A known-good request shows the same non-finite values.",
        "root_cause": "Those stages observe memory that has not been initialized yet for this step. Non-finite content there carries no information about correctness.",
        "resolution": "Compare the candidate dump against a known-good request before attributing any non-finite finding, and place capture points after initialization rather than before it. Report the first non-finite stage that a passing run does not also exhibit.",
        "avoidance": "Do not treat the first non-finite stage in a single dump as the answer. Name the capture point relative to initialization, for example after_clear rather than initial_state, so the manifest cannot be misread later.",
        "fingerprints": [
          "nan in initial state before clear",
          "nan destination before copy expected",
          "first nonfinite stage also present in passing run"
        ],
        "verification": [
          "The same non-finite values appeared in a passing request at the pre-clear stages, ruling them out as the cause and moving attribution to a later layer (Kimi-K3 state-dump investigation, 2026-08)."
        ]
      }
    }
  ]
}
