name: Split reconciliation

# Compares what the repository split declared as moving against what the
# destination repositories actually contain. See docs/split-reconciliation.md.
#
# Only the public destinations are checked out here; this workflow holds no
# credentials for the private ones (remote-dev, vaws-top), so their rows are
# reported `unverified`, never `arrived`. A maintainer with organization access
# confirms those locally and records the result in the ledger.

on:
  pull_request:
    paths:
      - ".agents/policy/split-ledger.json"
      - ".agents/scripts/split_reconcile.py"
      - ".agents/tests/test_split_reconcile_ledger.py"
      - "docs/split-reconciliation.md"
      - ".github/workflows/split-reconcile.yml"
  push:
    branches:
      - main
  schedule:
    # Destinations change without touching this repository; look once a day
    # so an arrival that is not yet recorded is noticed within a day.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the published scaffold default branch
        # The checker inspects refs/remotes/origin/main, not PR HEAD. It does
        # not fetch itself and holds no private destination credentials.
        run: git fetch --no-tags --update-head-ok origin refs/heads/main:refs/remotes/origin/main
      - uses: actions/checkout@v4
        with:
          repository: vllm-ascend-workspace/vaws-coordinator
          ref: main
          path: .vaws-local/split-refs/vaws-coordinator
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: vllm-ascend-workspace/vaws-knowledge
          ref: main
          path: .vaws-local/split-refs/vaws-knowledge
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile the split ledger
        # Enforce mode fails when a recorded state disagrees with what the
        # checker observes in a destination it could inspect.
        run: |
          python -B .agents/scripts/split_reconcile.py --mode enforce \
            --destination vaws-coordinator=.vaws-local/split-refs/vaws-coordinator \
            --destination vaws-knowledge=.vaws-local/split-refs/vaws-knowledge
      - name: Run reconciliation tests
        run: python -B -m unittest discover -s .agents/tests -p "test_split_reconcile_ledger.py"
