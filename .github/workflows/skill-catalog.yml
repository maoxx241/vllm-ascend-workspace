name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  local-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            platform: linux
          - os: windows-latest
            python: '3.13'
            platform: win32
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: .vaws-local/venvs/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked workspace packages
        run: python .agents/scripts/vaws_deps.py sync --locked --group dev
      - name: Verify system interpreter handoff
        run: python .agents/scripts/vaws_deps.py doctor
      - name: Run all local workspace and skill tests
        run: uv run python -B .agents/scripts/local_tests.py --jobs 2 --timeout 600 > workspace-results.json
      - name: Enforce repository ownership and tracked paths
        run: |
          uv run python -B .agents/scripts/repo_boundary_check.py --mode enforce
          uv run python -B .agents/scripts/tracked_path_check.py --mode enforce
        shell: bash
      - name: Validate Ray shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/ray_head.sh scripts/ray_worker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-results-${{ matrix.platform }}
          path: |
            workspace-results.json
            .vaws-local/test-runs/
          include-hidden-files: true
