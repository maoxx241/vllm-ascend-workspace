name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked workspace packages
        run: uv sync --locked --group dev
      - name: Doctor via system python3
        run: |
          python3 .agents/scripts/vaws_deps.py doctor > "${RUNNER_TEMP}/doctor.json"
          python3 -c 'import json, pathlib, sys
          envelope = json.loads(pathlib.Path(sys.argv[1]).read_text())
          outcome = envelope.get("outcome")
          if outcome != "success":
              raise SystemExit(f"doctor outcome {outcome!r} is not success")
          ' "${RUNNER_TEMP}/doctor.json"
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Run the full .agents/tests suite
        run: uv run python -B -m pytest .agents/tests -q
      - name: Validate catalog
        run: uv run python -B .agents/scripts/skill_catalog.py
      - name: Validate shared knowledge
        run: uv run python -B .agents/scripts/knowledge_validate.py
      - name: Check repository boundaries
        # Enforce mode fails on a violation the dated baseline does not
        # already record, and on a baseline row whose violation is gone.
        # See docs/target-state.md. Submodules are not checked out here
        # and the guard skips them regardless.
        run: uv run python -B .agents/scripts/repo_boundary_check.py --mode enforce
      - name: Check tracked in-tree paths
        run: uv run python -B .agents/scripts/tracked_path_check.py --mode enforce
      - name: Scan tracked files for leaks
        run: uv run python -B .agents/scripts/tracked_leak_scan.py --format json
      - name: Launcher status
        run: uv run python -B .agents/scripts/vaws.py status
      - name: Run repo-init tests
        run: uv run python -B -m unittest discover -s .agents/skills/repo-init/tests
      - name: Check generated Claude shims and ModelScope Trae projection
        run: uv run python -B .agents/scripts/sync_claude_skills.py --check
      - name: Run modelscope tests
        run: uv run python -B -m unittest discover -s .agents/skills/modelscope/tests
      - name: Run graph-debug tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-graph-debug/tests
      - name: Run correctness-validation tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-correctness-validation/tests
      - name: Run change-validation tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-change-validation/tests
      - name: Run performance-regression tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-performance-regression/tests


      - name: Run serving consumer tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-serving/tests

      - name: Run benchmark smoke tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-benchmark/tests

      - name: Run npu-fleet-monitor consumer tests
        run: uv run python -B -m unittest discover -s .agents/skills/npu-fleet-monitor/tests

      - name: Validate parameterized Ray helpers
        run: bash -n scripts/ray_head.sh scripts/ray_worker.sh

      - name: Run distributed-debug tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-distributed-debug/tests

      - name: Run operator-debug tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-operator-debug/tests

      - name: Run tensor-dump tests
        run: |
          uv run python -B -m unittest discover -s .agents/skills/ascend-tensor-dump/tests
          uv run python -B -m py_compile \
            .agents/skills/ascend-tensor-dump/assets/dump_probe.py \
            .agents/skills/ascend-tensor-dump/assets/replay_op.py

      - name: Run Triton development tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-triton-operator-development/tests

      - name: Run Triton validation tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-triton-kernel-validation/tests

      - name: Run Triton optimization tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-triton-kernel-optimization/tests

      - name: Run Triton workflow tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-triton-workflow/tests

      - name: Run PD-serving tests
        run: uv run python -B -m unittest discover -s .agents/skills/vllm-ascend-pd-serving/tests

      - name: Run memory-profiling tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-memory-profiling/tests

      - name: Run profiling-collection tests
        run: uv run python -B -m unittest discover -s .agents/skills/ascend-profiling-collection/tests

      - name: Run profiling-analysis tests
        run: |
          uv pip install -r .agents/skills/ascend-profiling-analysis/requirements.txt
          uv run python -B -m pytest .agents/skills/ascend-profiling-analysis/tests -q
