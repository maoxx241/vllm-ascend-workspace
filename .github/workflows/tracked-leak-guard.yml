name: Tracked leak guard

# Enforces the AGENTS.md rule "Never write secrets, passwords, or tokens into
# tracked files" for every pull request. The same scanner backs the local
# pre-commit hook, so CI and the hook cannot disagree.

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: the job only reads the checkout. It posts no comments, needs
# no token beyond the implicit read, and writes nothing back to the repository.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule content is upstream and out of scope; the scanner skips
          # gitlinks anyway, and skipping the clone keeps the job fast.
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the tracked tree
        # No pip install: the scanner reads its policy with PyYAML when present
        # and falls back to a built-in parser otherwise.
        run: python -B .agents/scripts/tracked_leak_scan.py --format json
      - name: Guard regression tests
        run: python -B -m unittest discover -s .agents/tests -p "test_tracked_leak_scan.py"
