name: Tracked leak guard

# Enforces the AGENTS.md rule "Never write secrets, passwords, or tokens into
# tracked files" for every pull request. The same scanner backs the local
# pre-commit hook. Both require the installed vaws-knowledge package (redaction
# rules live there after P13), so CI and the hook cannot disagree.

on:
  pull_request:
  push:
    branches:
      - main

# Least privilege: the job only reads the checkout. It posts no comments, needs
# no token beyond the implicit read, and writes nothing back to the repository.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Submodule content is upstream and out of scope; the scanner skips
          # gitlinks anyway, and skipping the clone keeps the job fast.
          submodules: false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install locked workspace packages
        run: uv sync --locked --group dev
      - name: Scan the tracked tree
        # Redaction rules live in the installed vaws-knowledge package.
        # A checkout without that package must refuse, not scan with fewer rules.
        run: uv run python -B .agents/scripts/tracked_leak_scan.py --format json
      - name: Guard regression tests
        run: uv run python -B -m unittest discover -s .agents/tests -p "test_tracked_leak_scan.py"
