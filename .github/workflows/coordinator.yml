name: Coordinator consumer contracts

# vaws-coordinator is a separate public package (its own ci.yml runs its
# suite, including Linux subreaper tests). This job covers the scaffold's
# side of the contract: lock, launcher, dual-provider setup and the
# official MCP SDK local-only session.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".agents/lib/vaws_coordinator_launch.py"
      - ".agents/lib/vaws_dependency.py"
      - ".agents/lib/vaws_venv.py"
      - ".agents/scripts/vaws.py"
      - ".agents/scripts/vaws_client_setup.py"
      - ".agents/hooks/vaws_session.py"
      - ".agents/tests/test_coordinator_consumer.py"
      - ".agents/tests/test_coordinator_official_stdio.py"
      - ".agents/tests/guarded_local_entry.py"
      - ".agents/skills/session-management/tests/test_agent_sessions.py"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/coordinator.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".agents/lib/vaws_coordinator_launch.py"
      - ".agents/lib/vaws_dependency.py"
      - ".agents/lib/vaws_venv.py"
      - ".agents/scripts/vaws.py"
      - ".agents/scripts/vaws_client_setup.py"
      - ".agents/hooks/vaws_session.py"
      - ".agents/tests/test_coordinator_consumer.py"
      - ".agents/tests/test_coordinator_official_stdio.py"
      - ".agents/tests/guarded_local_entry.py"
      - ".agents/skills/session-management/tests/test_agent_sessions.py"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/coordinator.yml"

permissions:
  contents: read

jobs:
  consumer:
    name: Package, launcher, setup fixtures and official stdio (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked workspace packages
        run: uv sync --locked --group dev
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Compile the scaffold
        run: uv run python -B -m compileall -q .agents
      - name: Consumer contract tests
        run: uv run python -B -m unittest discover -s .agents/tests -p "test_coordinator_consumer.py" -v
      - name: Official SDK stdio session
        run: uv run python -B -m unittest discover -s .agents/tests -p "test_coordinator_official_stdio.py" -v
      - name: Session hook and setup tests
        run: uv run python -B -m unittest discover -s .agents/skills/session-management/tests -p "test_agent_sessions.py" -v
      - name: Launcher status
        run: uv run python -B .agents/scripts/vaws.py status
      - name: Generated Claude shims and ModelScope Trae projection are in sync
        run: uv run python -B .agents/scripts/sync_claude_skills.py --check
