name: Remote-dev consumer contracts

# The remote-dev substrate is the installed vaws-remote-dev package
# (vllm-ascend-workspace/remote-dev; its own ci.yml runs its suite). This job
# covers the scaffold's side of the contract: the resolver plugin, client
# configuration, and package import.

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".agents/lib/vaws_remote_dev.py"
      - ".agents/lib/vaws_remote_dev_plugin.py"
      - ".agents/lib/vaws_session_id.py"
      - ".agents/lib/vaws_dependency.py"
      - ".agents/lib/vaws_venv.py"
      - ".agents/scripts/sync_claude_skills.py"
      - ".agents/scripts/vaws.py"
      - ".agents/scripts/vaws_client_setup.py"
      - ".agents/tests/test_remote_dev_consumer.py"
      - ".claude/**"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/remote-dev.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".agents/lib/vaws_remote_dev.py"
      - ".agents/lib/vaws_remote_dev_plugin.py"
      - ".agents/lib/vaws_session_id.py"
      - ".agents/lib/vaws_dependency.py"
      - ".agents/lib/vaws_venv.py"
      - ".agents/scripts/sync_claude_skills.py"
      - ".agents/scripts/vaws.py"
      - ".agents/scripts/vaws_client_setup.py"
      - ".agents/tests/test_remote_dev_consumer.py"
      - ".claude/**"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/remote-dev.yml"

permissions:
  contents: read

jobs:
  consumer:
    name: Resolver plugin, package and client wiring (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked workspace packages
        run: uv sync --locked --group dev
      - name: Lockfile matches pyproject
        run: uv lock --check
      - name: Compile the scaffold
        run: uv run python -B -m compileall -q .agents
      - name: Consumer contract tests
        run: uv run python -B -m unittest discover -s .agents/tests -p "test_remote_dev_consumer.py" -v
      - name: Package import
        run: |
          uv run python -c "import remote_dev.result, remote_dev.core.endpoint; print('ok')"
      - name: Generated Claude shims and ModelScope Trae projection are in sync
        run: uv run python -B .agents/scripts/sync_claude_skills.py --check
