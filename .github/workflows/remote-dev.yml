name: Remote-dev contracts

on:
  pull_request:
    paths:
      - ".remote-dev/**"
      - ".agents/lib/**"
      - ".agents/scripts/vaws.py"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/remote-dev.yml"
  push:
    branches: [main]
    paths:
      - ".remote-dev/**"
      - ".agents/lib/**"
      - ".agents/scripts/vaws.py"
      - ".mcp.json"
      - ".cursor/mcp.json"
      - ".codex/config.example.toml"
      - ".grok/config.example.toml"
      - ".github/workflows/remote-dev.yml"

permissions:
  contents: read

jobs:
  contracts:
    name: MCP and remote safety (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test portable MCP schemas, dispatch, and remote safety
        # Discovery runs every module in .remote-dev/tests so new tests (CLI
        # freshness, grep fallback semantics, mux, auto-bind, job lifecycle)
        # cannot silently lack a CI entry again. Each test module puts the
        # substrate on sys.path itself. Temporary files and bounded Linux
        # process checks; no SSH/NPU access; Linux-only modules self-skip.
        run: python -B -m unittest discover -s .remote-dev/tests
