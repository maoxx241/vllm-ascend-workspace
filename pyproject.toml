[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "vaws-remote-dev==0.1.0",
  "vaws-coordinator==0.2.0",
  "vaws-knowledge==0.1.3",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
  "mcp==2.1.1",
]

[tool.uv]
package = false

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", tag = "v0.1.0" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "785c9dc00cfce8f988fa35d60c1c5c0f6e63d868" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", tag = "v0.1.3" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
