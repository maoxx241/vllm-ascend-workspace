[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "vaws-remote-dev==0.5.0",
  "vaws-coordinator==0.3.1",
  "vaws-knowledge==0.3.2",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
  "mcp==1.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "d0f963c9c10eaee8664f0f467745be4116f881d5" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "361ea535a580344d4672a5263ba442269043fd60" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "41363d3641bfac47f202e77ce845aad68e6dc58c" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
