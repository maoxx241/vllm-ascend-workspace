[project]
name = "vaws-workspace"
version = "0"
requires-python = ">=3.11"
dependencies = [
  "vaws-remote-dev==0.5.1",
  "vaws-coordinator==0.3.2",
  "vaws-knowledge==0.3.2",
]

[dependency-groups]
dev = [
  "pytest",
  "pyyaml",
  "jsonschema",
  "mcp==1.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
vaws-remote-dev = { git = "https://github.com/vllm-ascend-workspace/remote-dev", rev = "c24a64a55e877904c9d539de4544ade0cc76cbac" }
vaws-coordinator = { git = "https://github.com/vllm-ascend-workspace/vaws-coordinator", rev = "d34f376678e96333f1ef088f4adb54e95053f9b5" }
vaws-knowledge = { git = "https://github.com/vllm-ascend-workspace/vaws-knowledge", rev = "41363d3641bfac47f202e77ce845aad68e6dc58c" }

[tool.pytest.ini_options]
pythonpath = [".agents/lib"]
testpaths = [".agents/tests"]
python_files = ["test_*.py"]
